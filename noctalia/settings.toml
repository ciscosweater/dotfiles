config_version = 20

[audio]

[bar.default]
background_opacity = 0.69999998435378075
end = [
    "media",
    "SpacerMidia",
    "widget",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "control-center",
    "session",
    "clock_2"
]
margin_edge = 8
margin_ends = 8
padding = 16
start = [ "launcher", "workspaces", "taskbar" ]

[brightness]
enable_ddcutil = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
concave_edge_corners = false
icon_size = 40
radius = 80

[hot_corners.top_left]
action = "window_switcher"

[idle]
pre_action_fade_seconds = 0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1", "lockscreen-login-box@WL-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 227.0
    cy = 307.0
    output = "WL-1"
    placement_height = 489.0
    placement_width = 454.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.69999998435378075
border = false

[osd]
background_opacity = 0.69999998435378075
border = false
hide_delay_ms = 1000

    [osd.kinds]
    media = false

[plugin_settings."yuuto/arch-updater"]
aur_helper = "yay"
auto_check_hours = 1
check_reboot_needed = true
config_review = false
flatpak_enabled = true
update_mode = "terminal"

[plugins]
enabled = [ "yuuto/arch-updater" ]

[shell]
button_borders = false
card_borders = false
font_family = "Noto Sans"
input_borders = false
lang = "pt-BR"
password_style = "random"
popup_borders = false
settings_window_translucent = true
telemetry_enabled = false

    [shell.launcher]
    category_icons_only = true
    compact = true
    layout = "simple"

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_show_names = false

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    annotate = true
    confirm_region = true
    skip_annotate_on_copy_save = true

    [shell.session]
    show_shortcuts = false

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "umbriel" ]
    community_ids = [ "claude-code", "discord", "obs", "opencode", "spotifast", "zapfast", "zed", "zen-browser" ]

[wallpaper]
directory = "@HOME@/Pictures/Wallpapers"

[widget.SpacerMidia]
type = "spacer"

[widget.brightness]
enabled = false

[widget.clock]
format = "{:%a, %d %b}"

    [widget.clock.actions]
    left = "panel-toggle control-center"

[widget.clock_2]
type = "clock"

[widget.control-center]
enabled = false

[widget.launcher]
glyph = "layout-grid-filled"

[widget.media]
font_scale = 0.90000000000000002
hide_when_no_media = true
rotate_album_art = true
show_progress = true

[widget.network]
show_label = false

[widget.taskbar]
group_single_icon_per_app = true
hide_empty_workspaces = true

[widget.tray]
hidden = [ "opendeck" ]

[widget.volume]
show_label = false

[widget.widget]
config_badge = false
font_scale = 0.90000000000000002
font_weight = 700
hide_on_empty = true
type = "yuuto/arch-updater:widget"

[widget.workspaces]
pill_scale = 0.75
show_labels = false