# Umbriel — atalhos
# Sintaxe: https://docs.noctalia.dev/umbriel/keybinds/
# Ações:   https://docs.noctalia.dev/umbriel/actions/
#
# Layout dwindle: não existem colunas com várias janelas nem abas.
# "column-move-*" e "window-move-*" fazem a mesma coisa aqui, então só usei
# window-*. Para trocar duas janelas de lugar sem mexer no split, use window-swap-*.

[keybinds]

# ─── Ajuda e sessão ───
"Mod+Shift+Escape"                  = { action = "cheatsheet-toggle", repeat = false }
"Ctrl+Alt+Delete"                   = { action = "session-quit", repeat = false }
# Escape de emergência quando um jogo/app inibe atalhos.
"Mod+Escape"                        = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# ─── Aplicativos ───
"Mod+Return"                        = { action = "spawn kitty", repeat = false }
"Mod+B"                             = { action = "spawn zen-browser", repeat = false }
"Mod+E"                             = { action = "spawn nautilus", repeat = false }

# ─── Noctalia ───
"Mod+Space"                         = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+Ctrl+Return"                   = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+S"                             = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+Ctrl+S"                        = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Shift+Return"                  = { action = "spawn noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+Alt+L"                         = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Shift+Q"                       = { action = "spawn noctalia msg panel-toggle session", repeat = false }

# ─── Estado da janela ───
"Mod+T"                             = { action = "window-toggle-floating", repeat = false }
"Mod+F"                             = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F"                       = { action = "window-toggle-fullscreen", repeat = false }
"Mod+M"                             = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Shift+V"                       = { action = "window-focus-switch-floating", repeat = false }
"Mod+Q"                             = { action = "window-close", repeat = false }

# ─── Foco ───
"Mod+Left"                          = "window-focus-left"
"Mod+H"                             = "window-focus-left"
"Mod+Right"                         = "window-focus-right"
"Mod+L"                             = "window-focus-right"
"Mod+Up"                            = "window-focus-up"
"Mod+K"                             = "window-focus-up"
"Mod+Down"                          = "window-focus-down"
"Mod+J"                             = "window-focus-down"

# ─── Mover janela no tiling (equivale ao move-column do niri) ───
"Mod+Ctrl+Left"                     = "window-move-left"
"Mod+Ctrl+H"                        = "window-move-left"
"Mod+Ctrl+Right"                    = "window-move-right"
"Mod+Ctrl+L"                        = "window-move-right"
"Mod+Ctrl+Up"                       = "window-move-up"
"Mod+Ctrl+K"                        = "window-move-up"
"Mod+Ctrl+Down"                     = "window-move-down"
"Mod+Ctrl+J"                        = "window-move-down"

# Trocar de lugar com o vizinho, mantendo o split onde está.
"Mod+Alt+Left"                      = "window-swap-left"
"Mod+Alt+Right"                     = "window-swap-right"
"Mod+Alt+Up"                        = "window-swap-up"
"Mod+Alt+Down"                      = "window-swap-down"

# "Consumir/expelir": no dwindle isso troca com o vizinho direcional.
"Mod+BracketLeft"                   = "window-consume-or-expel-left"
"Mod+BracketRight"                  = "window-consume-or-expel-right"
"Mod+Comma"                         = "window-consume-left"
"Mod+Period"                        = "window-consume-right"

# ─── Monitor ───
"Mod+Shift+Left"                    = "output-focus-left"
"Mod+Shift+Right"                   = "output-focus-right"
"Mod+Shift+Up"                      = "output-focus-up"
"Mod+Shift+Down"                    = "output-focus-down"
"Mod+Ctrl+Shift+Left"               = "window-move-to-output-left"
"Mod+Ctrl+Shift+Right"              = "window-move-to-output-right"
"Mod+Ctrl+Shift+Up"                 = "window-move-to-output-up"
"Mod+Ctrl+Shift+Down"               = "window-move-to-output-down"

# ─── Tamanho (dwindle: primary = split horizontal, secondary = vertical) ───
"Mod+R"                             = "window-cycle-primary-extent"
"Mod+Shift+R"                       = "window-cycle-primary-extent-back"
"Mod+Minus"                         = "window-modify-primary-extent -0.02"
"Mod+Equal"                         = "window-modify-primary-extent +0.02"
"Mod+Shift+Minus"                   = "window-modify-secondary-extent -0.02"
"Mod+Shift+Equal"                   = "window-modify-secondary-extent +0.02"

# Inverter o split do tile focado (recurso do dwindle).
"Mod+Alt+T"                         = { action = "layout-toggle-split", repeat = false }

# ─── Workspaces ───
"Mod+1"                             = "workspace-switch 1"
"Mod+2"                             = "workspace-switch 2"
"Mod+3"                             = "workspace-switch 3"
"Mod+4"                             = "workspace-switch 4"
"Mod+5"                             = "workspace-switch 5"
"Mod+6"                             = "workspace-switch 6"
"Mod+7"                             = "workspace-switch 7"
"Mod+8"                             = "workspace-switch 8"
"Mod+9"                             = "workspace-switch 9"

"Mod+Ctrl+1"                        = "window-move-to-workspace 1"
"Mod+Ctrl+2"                        = "window-move-to-workspace 2"
"Mod+Ctrl+3"                        = "window-move-to-workspace 3"
"Mod+Ctrl+4"                        = "window-move-to-workspace 4"
"Mod+Ctrl+5"                        = "window-move-to-workspace 5"
"Mod+Ctrl+6"                        = "window-move-to-workspace 6"
"Mod+Ctrl+7"                        = "window-move-to-workspace 7"
"Mod+Ctrl+8"                        = "window-move-to-workspace 8"
"Mod+Ctrl+9"                        = "window-move-to-workspace 9"

"Mod+Tab"                           = "workspace-previous"
"Mod+Ctrl+Tab"                      = "workspace-next"
# Anterior/próximo workspace do monitor atual (cada monitor tem a sua sequência)
"Mod+A"                             = "workspace-previous"
"Mod+D"                             = "workspace-next"

# ─── Scroll do mouse ───
"Mod+WheelUp"                       = "window-focus-left"
"Mod+WheelDown"                     = "window-focus-right"
"Mod+WheelLeft"                     = "window-focus-left"
"Mod+WheelRight"                    = "window-focus-right"
"Mod+Ctrl+WheelUp"                  = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown"                = { action = "workspace-next", cooldown_ms = 150 }

# ─── Visão geral ───
"Mod+O"                             = { action = "overview-toggle", repeat = false }

# ─── Telas ───
"Mod+Shift+P"                       = "dpms-off"

# ─── Screenshots (pelo Noctalia) ───
"Mod+Shift+S"                       = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Ctrl+Shift+1"                      = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Ctrl+Shift+2"                      = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Ctrl+Shift+3"                      = { action = "spawn noctalia msg screenshot-window", repeat = false }

# ─── Mídia e brilho (via Noctalia, com OSD; valem com a tela bloqueada) ───
"XF86AudioRaiseVolume"              = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume"              = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute"                     = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute"                  = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioNext"                     = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev"                     = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86AudioPlay"                     = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause"                    = { action = "spawn noctalia msg media pause", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp"               = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown"             = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# ─── Scratchpad (o niri não tinha; opcional) ───
# "Mod+Shift+Space"                 = "window-move-to-scratchpad"
# "Mod+Alt+Space"                   = "scratchpad-toggle"
